:root {
  --bg:#121114; --surface:#201f24; --surf2:#2c2b31; --border:#5b585f;
  --accent:#5fae82; --accent2:#e2793f; --text:#f0eee9; --muted:#a89f92;
  --danger:#ff6b5b; --green:#5fae82; --purple:#b39bfb;
  --radius:14px; --shadow:0 1px 4px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100dvh;overscroll-behavior:none;font-size:17px}

/* HEADER */
header{position:sticky;top:0;z-index:200;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 14px 0}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.app-title{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:4px;color:var(--accent);line-height:1}
.app-title sup{font-family:'DM Sans',sans-serif;font-size:.5rem;color:var(--muted);letter-spacing:1px;vertical-align:super;margin-left:3px}
.hdr-btns{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn-hdr{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px 11px;color:var(--accent2);font-size:.72rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;box-shadow:var(--shadow)}
.btn-hdr.small{font-size:.62rem;padding:4px 8px;color:var(--muted)}
.btn-hdr.active-lock{color:var(--accent);border-color:var(--accent)}
#last-banner{font-size:.72rem;color:var(--muted);min-height:13px;margin:4px 0 8px}
#last-banner strong{color:var(--accent2)}

/* TABS */
.tabs{display:flex;gap:5px;padding-bottom:10px;overflow-x:auto}
.tab{flex-shrink:0;padding:9px 12px;background:var(--surface);border:2px solid var(--border);border-radius:10px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;box-shadow:var(--shadow)}
.tab.active{color:var(--accent);border-color:var(--accent);background:rgba(95,174,130,.16)}
.tab.in-progress{color:var(--accent2);border-color:var(--accent2);background:rgba(226,121,63,.16)}

/* MAIN */
main{padding:14px;padding-bottom:120px}
.settings-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.settings-bar .lbl{font-size:.76rem;color:var(--muted);flex:1}
.settings-bar input[type=number]{width:56px;background:var(--surf2);border:1px solid var(--border);border-radius:7px;color:var(--accent);font-family:'Bebas Neue',sans-serif;font-size:1.1rem;text-align:center;padding:3px 5px}
.settings-bar .unit{font-size:.76rem;color:var(--muted)}
.day-header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.day-name-input{background:none;border:none;border-bottom:2px solid var(--border);color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:2px;flex:1;padding:2px 4px;transition:border-color .2s}
.day-name-input:focus{outline:none;border-bottom-color:var(--accent)}
.day-name-input:read-only{border-bottom-color:transparent;cursor:default}

/* EXERCISE CARD */
.exercise-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;gap:8px;padding:11px 13px;cursor:pointer;user-select:none}
.card-title{flex:1;font-weight:600;font-size:.93rem;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card-meta{font-size:.7rem;color:var(--muted);white-space:nowrap}
.card-chevron{color:var(--muted);font-size:.72rem;transition:transform .25s}
.exercise-card.open .card-chevron{transform:rotate(180deg)}
.card-body{display:none;padding:0 13px 13px;border-top:1px solid var(--border)}
.exercise-card.open .card-body{display:block}
.card-modified{font-size:.63rem;color:var(--muted);padding:2px 13px 5px;font-style:italic}
.card-done-badge{background:var(--green);color:var(--bg);font-size:.62rem;font-weight:700;border-radius:20px;padding:3px 8px;letter-spacing:.5px;white-space:nowrap;align-self:center}

/* SERIE */
.series-section{margin-top:12px}
.series-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.series-list{display:flex;flex-direction:column;gap:7px}
.serie-row{display:flex;align-items:center;gap:9px;background:var(--surf2);border:1px solid var(--border);border-radius:9px;padding:7px 9px;transition:background .15s}
.serie-row.done-row{background:rgba(95,174,130,.16);border-color:rgba(95,174,130,.45)}
.serie-num{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--muted);width:20px;text-align:center;flex-shrink:0}
.serie-reps-wrap{display:flex;align-items:center;gap:5px;flex:1}
.serie-reps-wrap label{font-size:.68rem;color:var(--muted);white-space:nowrap}
.serie-reps-input{width:52px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;text-align:center;padding:4px 3px}
.serie-reps-input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.serie-check-btn{width:40px;height:40px;border-radius:9px;flex-shrink:0;border:2px solid var(--border);background:var(--surface);color:var(--muted);font-size:.95rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.serie-check-btn.done{background:var(--accent);border-color:var(--accent);color:var(--bg);font-size:1rem}

/* PESO — sempre editabile */
.weight-input-wrap{display:flex;align-items:center;gap:4px}
.weight-big{width:68px;background:var(--surface);border:1px solid var(--accent);border-radius:7px;color:var(--accent);font-family:'Bebas Neue',sans-serif;font-size:1.32rem;text-align:center;padding:4px 4px;letter-spacing:1px}
.weight-big:focus{outline:2px solid var(--accent)}
.weight-unit{font-size:.68rem;color:var(--muted)}

/* NOTES */
.notes-toggle{display:flex;align-items:center;gap:7px;background:none;border:none;padding:9px 0 3px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;width:100%}
.notes-chevron{font-size:.68rem;transition:transform .2s}
.notes-toggle.open .notes-chevron{transform:rotate(180deg)}
.notes-body{display:none;margin-top:5px}
.notes-body.open{display:block}
.notes-body textarea{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.85rem;padding:7px 9px;resize:none;height:130px}
.notes-body textarea:focus{outline:none;border-color:var(--accent)}

/* EDIT MODE — campi modificabili solo in edit */
.edit-field{display:none}
.edit-mode .edit-field{display:block}
.edit-field input[type=number],.edit-field input[type=text],.edit-field select{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:7px 9px}
.edit-field input:focus{outline:none;border-color:var(--accent)}
.edit-field label{display:block;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;margin-top:10px}
.field-row{display:flex;gap:7px;margin-top:4px}
.field-group{flex:1}
.btn-pyramid{background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 3px;opacity:.3;transition:opacity .2s;line-height:1;flex-shrink:0}
.btn-swap{background:none;border:none;cursor:pointer;font-size:.95rem;padding:2px 4px;opacity:.55;transition:opacity .2s;line-height:1;flex-shrink:0}
.btn-swap:active{opacity:1}
.card-substitute-note{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.68rem;color:var(--accent2);background:rgba(226,121,63,.12);padding:5px 13px;border-top:1px solid var(--border)}
.btn-revert-sub{background:none;border:1px solid var(--accent2);border-radius:12px;padding:2px 9px;color:var(--accent2);font-size:.65rem;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.btn-pyramid.active{opacity:1}
#main.edit-mode .btn-pyramid{cursor:pointer;pointer-events:auto}
#main:not(.edit-mode) .btn-pyramid{cursor:default;pointer-events:none}

/* CARD ACTIONS (solo edit mode) */
.card-actions{display:none;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.edit-mode .card-actions{display:flex}
.btn-remove-slot{background:none;border:1px solid var(--danger);border-radius:7px;padding:5px 12px;color:var(--danger);font-size:.75rem;cursor:pointer;font-family:'DM Sans',sans-serif}
.position-wrap{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
.position-wrap input{width:48px;background:var(--surf2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:1rem;text-align:center;padding:3px 4px}

/* ADD BUTTON */
.btn-add-slot{width:100%;padding:12px;background:none;border:2px dashed var(--border);border-radius:var(--radius);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;margin-bottom:14px;display:none}
.edit-mode .btn-add-slot{display:block}
.btn-add-slot:active{border-color:var(--accent);color:var(--accent)}
.btn-close-workout{width:100%;padding:14px;background:var(--accent2);border:none;border-radius:var(--radius);color:var(--bg);font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:2px;cursor:pointer}

/* TIMER */
#timer-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(18,17,20,.97);flex-direction:column;align-items:center;justify-content:flex-start;padding-top:28px;gap:9px;overflow-y:auto}
#timer-overlay.visible{display:flex}
.timer-label{font-size:.82rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase}
.timer-ring{position:relative;width:174px;height:174px;flex-shrink:0}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle.bg{fill:none;stroke:var(--surf2);stroke-width:10}
.timer-ring circle.prog{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.timer-count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:3.1rem;letter-spacing:3px;color:var(--accent)}
.timer-stats{display:flex;gap:18px;align-items:center;justify-content:center}
.timer-stat{text-align:center}
.timer-stat-value{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;color:var(--text);line-height:1}
.timer-stat-label{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:1px}
.timer-stat-sep{font-size:1.3rem;color:var(--border)}
.btn-skip-timer{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 24px;color:var(--muted);font-size:.83rem;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:var(--shadow);flex-shrink:0}
.difficulty-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 15px;box-shadow:var(--shadow);text-align:center;width:100%;max-width:360px}
.difficulty-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.difficulty-btns{display:flex;gap:9px;justify-content:center}
.diff-item{display:flex;flex-direction:column;align-items:center}
.diff-btn{font-size:1.9rem;background:none;border:2px solid transparent;border-radius:10px;padding:5px 12px;cursor:pointer;transition:all .2s;line-height:1}
.diff-btn.selected{border-color:var(--accent);background:rgba(95,174,130,.16)}
.diff-count{font-size:.68rem;font-weight:700;color:var(--accent);text-align:center;margin-top:1px;min-height:13px;font-family:'DM Sans',sans-serif}
.timer-info-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 15px;box-shadow:var(--shadow)}
.timer-next-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px}
.timer-next{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--accent);letter-spacing:2px;line-height:1.1}
.timer-completed{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--accent2);letter-spacing:2px}
.timer-notes-text{font-size:.8rem;color:var(--text);line-height:1.5;white-space:pre-wrap;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}

/* MODAL */
.modal-backdrop{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
.modal-backdrop.visible{display:flex}
.modal-sheet{width:100%;max-width:480px;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding:18px 18px 34px;animation:slideUp .25s ease;box-shadow:0 -4px 20px rgba(0,0,0,.1);max-height:90dvh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:2px;color:var(--accent);margin-bottom:12px}
.modal-row{margin-bottom:12px}
.modal-row label{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.modal-row input,.modal-row textarea,.modal-row select{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.95rem;padding:9px 12px}
.modal-row input:focus,.modal-row textarea:focus{outline:none;border-color:var(--accent)}
.modal-row textarea{resize:none;height:120px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.btn-primary{flex:1;padding:12px;background:var(--accent);border:none;border-radius:9px;color:var(--bg);font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:1px;cursor:pointer}
.btn-secondary{padding:12px 16px;background:var(--surf2);border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:.83rem;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-danger{padding:12px 16px;background:none;border:1px solid var(--danger);border-radius:9px;color:var(--danger);font-size:.83rem;cursor:pointer;font-family:'DM Sans',sans-serif}
.modal-prev{font-size:.8rem;color:var(--muted);margin-bottom:12px;min-height:16px}
.modal-prev strong{color:var(--accent2)}
.modal-subtitle{font-size:.75rem;color:var(--muted);margin-bottom:14px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.toggle-row label{font-size:.83rem;color:var(--text)}
.toggle-btn{background:none;border:2px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.75rem;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .2s}
.toggle-btn.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* LIBRERIA MODALE */
.ex-list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surf2);border:1px solid var(--border);border-radius:9px;margin-bottom:7px;cursor:pointer;transition:background .15s}
.ex-list-item:active{background:rgba(95,174,130,.16)}
.ex-list-name{flex:1;font-weight:600;font-size:.88rem}
.ex-list-meta{font-size:.7rem;color:var(--muted)}
.ex-list-add{font-size:1.2rem;color:var(--accent)}
.ex-search{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:.9rem;margin-bottom:10px}
.ex-search:focus{outline:none;border-color:var(--accent)}
.sub-revert-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:rgba(226,121,63,.12);border:1px solid var(--accent2);border-radius:9px;margin-bottom:10px;cursor:pointer;color:var(--accent2);font-size:.85rem;font-weight:600}

/* SETTINGS SCREEN */
#settings-screen{display:none;position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto;padding:18px 15px 80px}
#settings-screen.visible{display:block}
.settings-header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.btn-back{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 13px;color:var(--text);font-size:.83rem;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:var(--shadow)}
.settings-title{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:3px;color:var(--accent)}
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.settings-section h3{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.numdays-btns{display:flex;gap:7px}
.numday-btn{flex:1;padding:10px 5px;background:var(--surf2);border:2px solid var(--border);border-radius:9px;font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--muted);cursor:pointer;text-align:center;transition:all .2s}
.numday-btn.active{background:rgba(95,174,130,.16);border-color:var(--accent);color:var(--accent)}
.ex-library-list{display:flex;flex-direction:column;gap:7px}
.ex-lib-item{display:flex;align-items:center;gap:9px;background:var(--surf2);border:1px solid var(--border);border-radius:9px;padding:9px 12px}
.ex-lib-name{flex:1;font-weight:600;font-size:.88rem}
.ex-lib-meta{font-size:.7rem;color:var(--muted)}
.btn-edit-ex{background:none;border:1px solid var(--border);border-radius:7px;padding:4px 10px;font-size:.72rem;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif}
.btn-del-ex{background:none;border:none;color:var(--danger);font-size:1rem;cursor:pointer;padding:2px 6px}

/* STATS */
#stats-screen{display:none;position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto;padding:18px 15px 80px}
#stats-screen.visible{display:block}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:18px;box-shadow:var(--shadow)}
.chart-wrap h3{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:11px}
#weight-canvas{width:100%;display:block;border-radius:7px}
.weight-list{display:flex;flex-direction:column;gap:7px}
.weight-entry{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 13px;box-shadow:var(--shadow)}
.we-date{font-size:.73rem;color:var(--muted);flex:1}
.we-kg{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;color:var(--accent);letter-spacing:1px}
.we-del{background:none;border:none;color:var(--danger);font-size:.95rem;cursor:pointer;padding:2px 5px}
.no-data{font-size:.83rem;color:var(--muted);text-align:center;padding:28px 0}

/* RIEPILOGO PER GRUPPO */
#summary-screen{display:none;position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto;padding:18px 15px 80px}
#summary-screen.visible{display:block}
.summary-group{margin-bottom:20px}
.summary-group-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border-radius:9px;margin-bottom:8px;box-shadow:var(--shadow)}
.summary-group-name{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:1px;color:var(--text)}
.summary-group-count{font-size:.7rem;color:var(--muted);white-space:nowrap}
.summary-ex-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 12px;margin-bottom:6px;box-shadow:var(--shadow)}
.summary-ex-name{font-weight:600;font-size:.85rem;flex-shrink:0}
.summary-ex-days{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.summary-day-badge{font-size:.65rem;color:var(--muted);background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:2px 8px;white-space:nowrap;cursor:default;user-select:none}
.summary-day-badge.assigned{color:var(--bg);background:var(--green);border-color:var(--green);font-weight:700}
body.edit-mode .summary-day-badge{cursor:pointer}
body.edit-mode .summary-day-badge:active{transform:scale(.93)}

/* CHIUDI ALLENAMENTO */
#close-modal .modal-row input[type=number]{font-size:1.05rem}

/* TOAST */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);border-radius:18px;padding:9px 18px;font-size:.8rem;color:var(--bg);opacity:0;transition:all .3s;z-index:600;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="app-title">GymLog<sup id="app-ver">—</sup></div>
    <div class="hdr-btns">
      <button class="btn-hdr small" onclick="importData()">⬆ Importa</button>
      <button class="btn-hdr small" onclick="exportData()">⬇ Esporta</button>
      <button class="btn-hdr small" onclick="downloadLog()">📄 Log</button>
      <button class="btn-hdr" onclick="openStats()">📊</button>
      <button class="btn-hdr" onclick="openSummary()" title="Riepilogo per gruppo">🗂️</button>
      <button class="btn-hdr" id="settings-btn" onclick="openSettings()" style="display:none">⚙️</button>
      <button class="btn-hdr" id="lock-btn" onclick="toggleEditMode()">🔒</button>
    </div>
  </div>
  <div id="last-banner">—</div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="main"></main>

<!-- TIMER -->
<div id="timer-overlay">
  <div class="timer-label">Riposo in corso</div>
  <div class="timer-ring">
    <svg width="174" height="174" viewBox="0 0 200 200">
      <circle class="bg" cx="100" cy="100" r="88"/>
      <circle class="prog" cx="100" cy="100" r="88" id="timer-prog" stroke-dasharray="553" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-count" id="timer-count">60</div>
  </div>
  <div class="timer-stats" id="timer-stats" style="display:none">
    <div class="timer-stat"><div class="timer-stat-value" id="timer-serie-val">—</div><div class="timer-stat-label">serie</div></div>
    <div class="timer-stat-sep">|</div>
    <div class="timer-stat"><div class="timer-stat-value" id="timer-ex-val">—</div><div class="timer-stat-label">esercizi</div></div>
  </div>
  <button class="btn-skip-timer" onclick="skipTimer()">Salta ▶</button>
  <div class="difficulty-box" id="difficulty-box" style="display:none">
    <div class="difficulty-label">Com'è andato l'esercizio?</div>
    <div class="difficulty-btns">
      <div class="diff-item"><button class="diff-btn" id="diff-0" onclick="setDifficulty(0)">🔴</button><div class="diff-count" id="diff-count-0"></div></div>
      <div class="diff-item"><button class="diff-btn" id="diff-1" onclick="setDifficulty(1)">🟡</button><div class="diff-count" id="diff-count-1"></div></div>
      <div class="diff-item"><button class="diff-btn" id="diff-2" onclick="setDifficulty(2)">🟢</button><div class="diff-count" id="diff-count-2"></div></div>
    </div>
  </div>
  <div class="timer-info-box" id="timer-info-box" style="display:none">
    <div class="timer-next-label" id="timer-next-label"></div>
    <div id="timer-next"></div>
    <div class="timer-notes-text" id="timer-notes-text"></div>
  </div>
</div>

<!-- MODAL CHIUDI ALLENAMENTO -->
<div class="modal-backdrop" id="close-modal">
  <div class="modal-sheet">
    <div class="modal-title">Chiudi Allenamento</div>
    <div class="modal-subtitle" id="close-modal-day"></div>
    <div class="modal-prev" id="close-modal-prev"></div>
    <div class="modal-row">
      <label>Peso corporeo oggi (kg) — facoltativo</label>
      <input type="number" id="bw-input" step="0.1" min="30" max="300" placeholder="es. 82.5">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('close-modal')">Annulla</button>
      <button class="btn-primary" onclick="confirmCloseWorkout()">Conferma</button>
    </div>
  </div>
</div>

<!-- MODAL AGGIUNGI ESERCIZIO AL GIORNO -->
<div class="modal-backdrop" id="add-slot-modal">
  <div class="modal-sheet">
    <div class="modal-title">Aggiungi esercizio</div>
    <input class="ex-search" type="text" placeholder="Cerca..." oninput="renderLibraryList(this.value)">
    <div id="library-list"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('add-slot-modal')">Chiudi</button>
      <button class="btn-primary" onclick="openExerciseEditor(null)">+ Nuovo esercizio</button>
    </div>
  </div>
</div>

<!-- MODAL SOSTITUZIONE TEMPORANEA -->
<div class="modal-backdrop" id="sub-picker-modal">
  <div class="modal-sheet">
    <div class="modal-title">Sostituisci temporaneamente</div>
    <div class="modal-subtitle" id="sub-picker-subtitle"></div>
    <div id="sub-picker-list"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('sub-picker-modal')">Chiudi</button>
    </div>
  </div>
</div>

<!-- MODAL EDITOR ESERCIZIO -->
<div class="modal-backdrop" id="ex-editor-modal">
  <div class="modal-sheet">
    <div class="modal-title" id="ex-editor-title">Nuovo esercizio</div>
    <div class="modal-row">
      <label>Nome</label>
      <input type="text" id="ex-ed-name" maxlength="50" placeholder="Es. Squat Goblet">
    </div>
    <div class="modal-row">
      <label>N° serie</label>
      <input type="number" id="ex-ed-sets" min="1" max="20" value="3">
    </div>
    <div class="modal-row">
      <label>Gruppo muscolare</label>
      <select id="ex-ed-group"></select>
    </div>
    <div class="toggle-row">
      <label>Piramidale (reps 15-12-10-8)</label>
      <button class="toggle-btn" id="ex-ed-pyramid-btn" onclick="toggleEdPyramid()">NO</button>
    </div>
    <div class="modal-row" style="margin-top:10px">
      <label>Note</label>
      <textarea id="ex-ed-notes" placeholder="Note, avvertenze..."></textarea>
    </div>
    <div class="modal-row">
      <label>Serie (reps × kg per ciascuna)</label>
      <div id="ex-ed-series"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('ex-editor-modal')">Annulla</button>
      <button class="btn-danger" id="ex-ed-del-btn" onclick="deleteExerciseFromLib()" style="display:none">🗑</button>
      <button class="btn-primary" onclick="saveExercise()">Salva</button>
    </div>
  </div>
</div>

<!-- SETTINGS SCREEN -->
<div id="settings-screen">
  <div class="settings-header">
    <button class="btn-back" onclick="closeSettings()">← Indietro</button>
    <div class="settings-title">Impostazioni</div>
  </div>
  <div class="settings-section">
    <h3>Numero giorni attivi</h3>
    <div class="numdays-btns" id="numdays-btns"></div>
  </div>
  <div class="settings-section">
    <h3>Libreria esercizi</h3>
    <button class="btn-primary" style="margin-bottom:12px;width:auto;padding:9px 16px;font-size:.9rem" onclick="openExerciseEditor(null)">+ Nuovo esercizio</button>
    <div class="ex-library-list" id="ex-library-list"></div>
  </div>
</div>

<!-- STATS SCREEN -->
<div id="stats-screen">
  <div class="settings-header">
    <button class="btn-back" onclick="closeStats()">← Indietro</button>
    <div class="settings-title">Peso Corporeo</div>
  </div>
  <div class="chart-wrap">
    <h3>Andamento nel tempo</h3>
    <canvas id="weight-canvas" height="180"></canvas>
  </div>
  <div class="weight-list" id="weight-list"></div>
</div>

<!-- RIEPILOGO PER GRUPPO -->
<div id="summary-screen">
  <div class="settings-header">
    <button class="btn-back" onclick="closeSummary()">← Indietro</button>
    <div class="settings-title">Riepilogo</div>
  </div>
  <div id="summary-body"></div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
// COSTANTI

const CIRC = 2 * Math.PI * 88;

// ═══════════════════════════════════════════
// GRUPPI MUSCOLARI (per colore + ordinamento + riepilogo)
// ═══════════════════════════════════════════
// Elenco chiuso (enum): l'id di ogni esercizio deve essere uno di questi.
// Per aggiungere/rinominare/ricolorare un gruppo in futuro, modifica SOLO
// questo array: il resto del codice si adatta automaticamente.
const GROUPS = [
  { id:'petto',     label:'Petto',      color:'#4d8fdd' },
  { id:'spalle',    label:'Spalle',     color:'#e0c23e' },
  { id:'schiena',   label:'Schiena',    color:'#3ecfb0' },
  { id:'bicipiti',  label:'Bicipiti',   color:'#b39bfb' },
  { id:'tricipiti', label:'Tricipiti',  color:'#d15fd1' },
  { id:'gambe',     label:'Gambe',      color:'#e05aa0' },
  { id:'core',      label:'Core',       color:'#9aa83e' },
];
const GROUP_IDS     = GROUPS.map(g => g.id);
const DEFAULT_GROUP = GROUP_IDS[0];
function groupInfo(id)  { return GROUPS.find(g => g.id === id) || GROUPS[0]; }
function groupIndex(id) { const i = GROUP_IDS.indexOf(id); return i === -1 ? GROUPS.length : i; }

// Mappatura automatica nome→gruppo, usata SOLO in migrazione (esercizi che
// non hanno ancora un gruppo assegnato). Nomi confrontati case-insensitive,
// spazi ai bordi ignorati. Se un nome non è in elenco, va a DEFAULT_GROUP
// e resta modificabile a mano nell'editor.
const GROUP_NAME_MAP = {
  'chest press':'petto', 'incline chest press':'petto',
  'spinte panca piana':'petto', 'spinte panca inclinata':'petto',
  'push up isometrico':'petto',
  'alzate laterali':'spalle', 'lento manubrio':'spalle',
  'lento avanti multipower':'spalle', 'alzate laterali al cavo unilaterale':'spalle',
  'shoulder press':'spalle',
  'low row':'schiena', 'rematore manubrio':'schiena', 'rematore bilanciere':'schiena',
  'lat machine con triangolo':'schiena', 'pulley':'schiena',
  'pulley presa inversa':'schiena', 'pulley presa stretta':'schiena',
  'iperestensione del busto':'schiena', 'pek back':'schiena', 'croci al pek back':'schiena',
  'bicipiti manubri supinati':'bicipiti', 'curl con bilancere':'bicipiti',
  'bicipiti hammer curl':'bicipiti', 'bicipiti panca scott':'bicipiti',
  'bicipiti manubrio 45°':'bicipiti',
  'tricipiti french press manubri':'tricipiti', 'tricipiti spinte in basso':'tricipiti',
  'tricipiti kick back al cavo':'tricipiti',
  'tricipiti spinte in basso seduto su panca inclinata':'tricipiti',
  'affondi camminati':'gambe', 'calf in piedi':'gambe', 'leg curl':'gambe',
  'leg extension':'gambe', 'squat goblet':'gambe', 'squat multipower':'gambe',
  'pressa 45°':'gambe', 'standing leg curl':'gambe', 'calf seduto':'gambe',
  'alzate gambe alle parallele':'core',
  'crunch':'core', 'sit up':'core', 'plank':'core', 'crunch inverso':'core',
};
// I 5 esercizi che nello schema precedente (v3.6-v3.8) erano nel gruppo
// unico "gambe" (allora "Gambe & Core") insieme a quelli di gambe vere e
// proprie. Usati SOLO dalla migrazione una-tantum qui sotto, per separare
// il vecchio "gambe" legacy in Gambe/Core senza toccare scelte manuali
// fatte dopo la migrazione (vedi MIGRAZIONE V3.9 in normalizeState).
const LEGACY_CORE_NAMES = new Set([
  'alzate gambe alle parallele','crunch','sit up','plank','crunch inverso'
]);
function guessGroup(name) {
  const key = String(name||'').trim().toLowerCase();
  return GROUP_NAME_MAP[key] || DEFAULT_GROUP;
}

// ═══════════════════════════════════════════
// LOG (offline, locale, niente rete)
// ═══════════════════════════════════════════
const LOG_KEY = 'gymlog_log';
const LOG_MAX = 400;                 // tetto voci per non gonfiare lo storage
let appLog = [];
function loadLog() {
  try { const r = localStorage.getItem(LOG_KEY); appLog = r ? JSON.parse(r) : []; }
  catch(e) { appLog = []; }
  if (!Array.isArray(appLog)) appLog = [];
}
function logEvent(msg) {
  try {
    appLog.push({ ts: Date.now(), msg: String(msg) });
    if (appLog.length > LOG_MAX) appLog = appLog.slice(-LOG_MAX);
    localStorage.setItem(LOG_KEY, JSON.stringify(appLog));
  } catch(e) { /* spazio o storage non disponibile: il log resta in memoria */ }
}
function downloadLog() {
  const head =
    `GymLog — log diagnostico\n` +
    `Versione: v${APP_VERSION} (${APP_DATE})\n` +
    `Generato: ${new Date().toISOString()}\n` +
    `User agent: ${navigator.userAgent}\n` +
    `Voci: ${appLog.length}\n` +
    `${'─'.repeat(48)}\n`;
  const body = appLog.length
    ? appLog.map(e => `${new Date(e.ts).toISOString()}  ${e.msg}`).join('\n')
    : '(nessun evento registrato)';
  const blob = new Blob([head + body + '\n'], { type: 'text/plain' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `gymlog_log_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📄 Log scaricato');
}
// Cattura errori runtime nel log
window.addEventListener('error', ev => logEvent('ERRORE: ' + (ev.message || ev.error || 'sconosciuto')));
window.addEventListener('unhandledrejection', ev => logEvent('PROMISE: ' + (ev.reason?.message || ev.reason || 'sconosciuto')));

  numDays: 3,
  days: [
    { name: '1° Allenamento', slots: [] },
    { name: '2° Allenamento', slots: [] },

    { name: '4° Allenamento', slots: [] },
    { name: '5° Allenamento', slots: [] },
  ],
  exercises: [],
  lastSession: null,
  bodyWeights: [],
  groupsMigratedV9: false
};

let activeTab = 0;
let editMode  = false;

// timer

// ═══════════════════════════════════════════
// PERSISTENZA
// ═══════════════════════════════════════════
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e) { logEvent('SAVE fallito: ' + e.message); showToast('⚠️ Spazio insufficiente'); }
}
// Difesa contro dati incompleti/malformati (import o versioni vecchie):
// garantisce che ogni slot abbia un array done coerente con le serie dell'esercizio.
function normalizeState() {
  if (!Array.isArray(state.exercises)) state.exercises = [];

  // MIGRAZIONE V3.9 (una-tantum): prima di v3.9 esisteva un unico gruppo
  // 'gambe' che copriva sia le gambe vere sia gli addominali ("Gambe & Core").
  // Qui separiamo i 5 esercizi noti di addominali in un gruppo 'core' a
  // parte. Gira una sola volta (flag persistito in state), così se in
  // seguito l'utente sceglie di rimettere a mano uno di questi esercizi
  // su 'gambe', la scelta manuale resta e non viene ripristinata a 'core'
  // al prossimo avvio.
  if (!state.groupsMigratedV9) {
    state.exercises.forEach(ex => {
      const key = String(ex.name||'').trim().toLowerCase();
      if (ex.group === 'gambe' && LEGACY_CORE_NAMES.has(key)) ex.group = 'core';
    });
    state.groupsMigratedV9 = true;
  }

  state.exercises.forEach(ex => {
    if (!Array.isArray(ex.series)) ex.series = [];
    ex.series.forEach(s => {
      if (typeof s.reps   !== 'number' || isNaN(s.reps))   s.reps   = 10;
      if (typeof s.weight !== 'number' || isNaN(s.weight)) s.weight = 0;
    });
    if (typeof ex.sets !== 'number' || ex.sets < 1) ex.sets = ex.series.length || 3;
    if (!ex.difficulty || typeof ex.difficulty !== 'object') ex.difficulty = { val:null, count:0 };
    if (typeof ex.pyramid !== 'boolean') ex.pyramid = false;
    if (typeof ex.lastDone !== 'number' || !isFinite(ex.lastDone)) ex.lastDone = null;
    if (typeof ex.notes !== 'string') ex.notes = ex.notes ? String(ex.notes) : '';
    // SICUREZZA: 'group' deve essere uno dei valori noti (whitelist).
    // Un JSON importato/manomesso con un valore arbitrario non viene mai
    // usato così com'è: se non è valido, si ricalcola dal nome o si usa
    // il default. Evita di propagare stringhe non previste nel rendering.
    // Questo stesso controllo assorbe anche la migrazione del vecchio
    // gruppo 'braccia' (rimosso in v3.9): non essendo più in GROUP_IDS,
    // ricade qui su guessGroup(), che ora smista in bicipiti/tricipiti.
    if (!GROUP_IDS.includes(ex.group)) ex.group = guessGroup(ex.name);
  });
  if (!Array.isArray(state.days)) state.days = [];
  state.days.forEach(d => {
    if (!Array.isArray(d.slots)) d.slots = [];
    d.slots.forEach(sl => {
      const ex   = findEx(sl.exId);
      const need = ex ? ex.series.length : (Array.isArray(sl.done) ? sl.done.length : 0);
      if (!Array.isArray(sl.done)) sl.done = [];
      while (sl.done.length < need) sl.done.push(false);
      if (need > 0) sl.done.splice(need);
      if (typeof sl.position !== 'number') sl.position = 0;

      // SICUREZZA: subExId (sostituzione temporanea) deve puntare a un
      // esercizio realmente esistente ed essere diverso dall'esercizio
      // previsto — altrimenti si annulla la sostituzione (torna a null),
      // non si propaga mai un id non valido nel rendering.
      if (sl.subExId != null) {
        const subEx = (typeof sl.subExId === 'string') ? findEx(sl.subExId) : null;
        if (!subEx || sl.subExId === sl.exId) { sl.subExId = null; sl.subDone = null; }
        else {
          if (!Array.isArray(sl.subDone)) sl.subDone = [];
          const subNeed = subEx.series.length;
          while (sl.subDone.length < subNeed) sl.subDone.push(false);
          if (subNeed > 0) sl.subDone.splice(subNeed);
        }
      } else {
        sl.subExId = null; sl.subDone = null;
      }
    });
  });
  if (!Array.isArray(state.bodyWeights)) state.bodyWeights = [];
}
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) { normalizeState(); return; }
    const s = JSON.parse(raw);
    state.restSeconds = s.restSeconds ?? 60;
    state.numDays     = s.numDays     ?? 3;
    state.days        = s.days        ?? state.days;
    state.exercises   = s.exercises   ?? [];
    state.lastSession = s.lastSession ?? null;
    state.bodyWeights = s.bodyWeights ?? [];
    state.groupsMigratedV9 = s.groupsMigratedV9 ?? false;
    normalizeState();
    saveState(); // persiste subito eventuale migrazione gruppi (una-tantum)
    logEvent(`Avvio: dati caricati (${state.exercises.length} esercizi)`);
  } catch(e) { logEvent('LOAD fallito: ' + e.message); console.warn('Errore caricamento:', e); normalizeState(); }
}
function hasData() { return !!localStorage.getItem(LS_KEY); }

// ═══════════════════════════════════════════
// EXPORT / IMPORT
// ═══════════════════════════════════════════
function exportData() {
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `gymlog_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  logEvent('Export dati JSON');
  showToast('✅ Esportato');
}
function importData() {
  const hasCurrent = state.exercises.length > 0 || state.days.some(d => d.slots.length > 0);
  if (hasCurrent && !confirm('Importare sovrascriverà TUTTI i dati attuali. Continuare?')) return;
  const input = document.createElement('input');
  input.type  = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const s = JSON.parse(ev.target.result);
        if (!s.days || !s.exercises) throw new Error('formato non valido');
        state.restSeconds = s.restSeconds ?? 60;
        state.numDays     = s.numDays     ?? 3;
        state.days        = s.days;
        state.exercises   = s.exercises;
        state.lastSession = s.lastSession ?? null;
        state.bodyWeights = s.bodyWeights ?? [];
        state.groupsMigratedV9 = s.groupsMigratedV9 ?? false;
        normalizeState();
        saveState(); render();
        logEvent(`Import OK: ${state.exercises.length} esercizi`);
        showToast('✅ Dati importati');
      } catch(err) { logEvent('Import fallito: ' + err.message); showToast('❌ File non valido'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ═══════════════════════════════════════════
// UTILITY
// ═══════════════════════════════════════════
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg, ms=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}
function findEx(id) { return state.exercises.find(e => e.id === id) ?? null; }
// SOSTITUZIONE TEMPORANEA (v3.11): uno slot può avere un esercizio
// "sostituto" (slot.subExId) attivo solo per l'allenamento corrente — la
// struttura di base (slot.exId) non cambia mai. Questi due helper
// restituiscono l'esercizio e l'array "done" REALMENTE in uso in questo
// momento per lo slot: il sostituto se presente e valido, altrimenti
// quello previsto.
function effEx(sl) {
  if (sl.subExId) { const e = findEx(sl.subExId); if (e) return e; }
  return findEx(sl.exId);
}
function effDone(sl) {
  return sl.subExId ? (sl.subDone ?? (sl.subDone = [])) : (sl.done ?? (sl.done = []));
}
// Le funzioni di editing (nome/serie/gruppo/piramidale...) ricevono l'id
// dell'esercizio MOSTRATO (che durante una sostituzione temporanea è il
// sostituto, non lo slot). Il DOM della card però è sempre keyed sull'exId
// ORIGINALE dello slot (identità stabile). Questo helper fa da ponte: dato
// l'id dell'esercizio mostrato, trova la card giusta nel giorno attivo.
function slotKeyFor(shownId) {
  const sl = state.days[activeTab].slots.find(s => s.exId === shownId || s.subExId === shownId);
  return sl ? sl.exId : shownId;
}
function getSlots() {
  return [...state.days[activeTab].slots].sort((a,b) => {
    const ea = findEx(a.exId), eb = findEx(b.exId);
    const ga = ea ? groupIndex(ea.group) : GROUPS.length;
    const gb = eb ? groupIndex(eb.group) : GROUPS.length;
    if (ga !== gb) return ga - gb;
    return a.position - b.position;
  });
}

// ═══════════════════════════════════════════
// RENDER PRINCIPALE
// ═══════════════════════════════════════════
function render() {
  renderTabs(); renderMain(); renderBanner();
  document.getElementById('lock-btn').textContent = editMode ? '🔓' : '🔒';
  document.getElementById('lock-btn').classList.toggle('active-lock', editMode);
  document.getElementById('settings-btn').style.display = editMode ? 'block' : 'none';
  document.getElementById('main').classList.toggle('edit-mode', editMode);
  document.body.classList.toggle('edit-mode', editMode);
}

function renderBanner() {
  const el = document.getElementById('last-banner');
  if (!state.lastSession) {
    // Nessuna sessione: distinguo "app vuota" (possibile reset/primo avvio) dal solo "mai chiuso"
    const empty = state.exercises.length === 0 && state.days.every(d => !d.slots.length);
    el.innerHTML = empty
      ? '⚠️ Nessun dato salvato — se è un aggiornamento, usa <strong>⬆ Importa</strong> in alto per ripristinare un backup'
      : 'Nessun allenamento registrato';
    return;
  }
  const d  = new Date(state.lastSession.ts);
  const ds = d.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' });
  const ts = d.toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
  el.innerHTML = `Ultimo: <strong>${escHtml(state.lastSession.dayName)}</strong> — ${ds} ${ts}`;
}

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = state.days.slice(0, state.numDays).map((d, i) => {
    const hasAny = d.slots.some(sl => effDone(sl).some(Boolean));
    let cls = 'tab';
    if (i === activeTab) cls += ' active';
    else if (hasAny)     cls += ' in-progress';
    return `<button class="${cls}" onclick="switchTab(${i})">${escHtml(d.name)}</button>`;
  }).join('');
}

function renderMain() {
  const day   = state.days[activeTab];
  const slots = getSlots();
  const cardsHtml = slots.map(sl => renderCard(sl)).join('');

  document.getElementById('main').innerHTML = `
    <div class="settings-bar">
      <span class="lbl">⏱ Riposo tra le serie</span>
      <input type="number" min="10" max="600" value="${state.restSeconds}" onchange="updateRest(this.value)">
      <span class="unit">sec</span>
    </div>
    <div class="day-header">
      <input class="day-name-input" type="text" maxlength="20"
             value="${escHtml(day.name)}"
             ${editMode ? '' : 'readonly'}
             onchange="updateDayName(${activeTab}, this.value)"
             placeholder="Nome giornata">
    </div>
    ${cardsHtml}
    <button class="btn-add-slot" onclick="openAddSlot()">+ Aggiungi esercizio</button>
    <button class="btn-close-workout" onclick="openCloseModal()">✓ Chiudi allenamento</button>
  `;
}

function renderCard(slot) {
  const ex      = findEx(slot.exId);          // esercizio PREVISTO dalla scheda (struttura fissa)
  if (!ex) return '';
  const shown   = effEx(slot) ?? ex;           // esercizio EFFETTIVAMENTE mostrato (sostituto se attivo)
  const done    = effDone(slot);               // array "done" dell'esercizio effettivo
  const doneCnt = done.filter(Boolean).length;
  const total   = shown.series.length;
  const allDone = doneCnt === total && total > 0;

  const modStr = shown.lastModified
    ? new Date(shown.lastModified).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})
    : null;

  const diff = shown.difficulty ?? {};
  const DIFF_ICON = {0:'🔴', 1:'🟡', 2:'🟢'};
  // Promemoria "aumenta il peso": dopo 3+ valutazioni verdi consecutive
  // senza cambiare peso/reps (il contatore si azzera ad ogni modifica di
  // serie, vedi updateSerieReps/updateSerieWeight), il pallino verde
  // diventa una freccia verde verso l'alto.
  const readyToIncrease = diff.val === 2 && diff.count >= 3;
  const diffIcon = readyToIncrease
    ? `<span style="color:var(--accent);font-weight:800" title="3+ valutazioni verdi consecutive: valuta di aumentare il peso">⬆</span>`
    : DIFF_ICON[diff.val];
  const diffHtml = diff.val != null
    ? `<span style="font-size:.85rem">${diffIcon}${diff.count>1?'<sup style="font-size:.6rem">×'+diff.count+'</sup>':''}</span>`
    : '';

  const badgeHtml = allDone ? `<span class="card-done-badge">✓ COMPLETATO</span>` : '';

  const seriesRows = shown.series.map((s, si) => {
    const isDone = done[si] === true;
    return `
    <div class="serie-row ${isDone?'done-row':''}" id="row-${slot.exId}-${activeTab}-${si}">
      <div class="serie-num">${si+1}</div>
      <div class="serie-reps-wrap">
        <label>Rip.</label>
        <input class="serie-reps-input" type="number" min="1" max="999" value="${s.reps}"
               onchange="updateSerieReps('${shown.id}', ${si}, +this.value)">
      </div>
      <div class="weight-input-wrap">
        <input class="weight-big" type="number" min="0" max="999" step="0.5" value="${s.weight}"
               onchange="updateSerieWeight('${shown.id}', ${si}, +this.value)">
        <span class="weight-unit">kg</span>
      </div>
      <button class="serie-check-btn ${isDone?'done':''}"
              onclick="toggleSerie('${slot.exId}', ${activeTab}, ${si})">
        ${isDone?'✓':'○'}
      </button>
    </div>`;
  }).join('');

  const cardId = `card-${slot.exId}-${activeTab}`;

  const groupColor = groupInfo(shown.group).color;

  const subNote = slot.subExId
    ? `<div class="card-substitute-note">🔀 In sostituzione di: ${escHtml(ex.name)}
        <button class="btn-revert-sub" onclick="event.stopPropagation(); revertSubstitute('${slot.exId}')">↩ ripristina</button>
      </div>`
    : '';

  return `
  <div class="exercise-card ${allDone?'all-done':''}" id="${cardId}" style="border-left:4px solid ${groupColor}">
    <div class="card-header" onclick="toggleCard('${cardId}')">
      <div class="card-title">
        ${escHtml(shown.name)} ${diffHtml} ${badgeHtml}
      </div>
      <button class="btn-swap" onclick="event.stopPropagation(); openSubPicker('${slot.exId}')"
              title="Sostituisci temporaneamente con un altro esercizio dello stesso gruppo">🔀</button>
      <button class="btn-pyramid ${shown.pyramid?'active':''}"
              onclick="event.stopPropagation(); togglePyramid('${shown.id}')"
              title="${shown.pyramid?'Piramidale attivo':'Piramidale disattivo'}">⚖️</button>
      <div class="card-meta" id="meta-${slot.exId}-${activeTab}">${doneCnt}/${total}</div>
      <div class="card-chevron">▼</div>
    </div>
    ${subNote}
    ${modStr?`<div class="card-modified">Modificato: ${modStr}</div>`:''}
    <div class="card-body">

      <div class="edit-field">
        <div class="field-row">
          <div class="field-group">
            <label>Nome</label>
            <input type="text" value="${escHtml(shown.name)}" maxlength="50"
                   onchange="updateExName('${shown.id}', this.value)">
          </div>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label>N° serie</label>
            <input type="number" min="1" max="20" value="${shown.sets}"
                   onchange="updateExSets('${shown.id}', +this.value)">
          </div>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label>Gruppo muscolare</label>
            <select onchange="updateExGroup('${shown.id}', this.value)">
              ${GROUPS.map(g => `<option value="${g.id}" ${g.id===shown.group?'selected':''}>${escHtml(g.label)}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>

      <button class="notes-toggle" onclick="toggleNotes('${shown.id}')" id="notes-btn-${shown.id}">
        📋 Note <span class="notes-chevron">▼</span>
      </button>
      <div class="notes-body" id="notes-body-${shown.id}">
        <textarea onchange="updateExField('${shown.id}','notes',this.value)"
                  placeholder="Note libere...">${escHtml(shown.notes)}</textarea>
      </div>

      <div class="series-section">
        <div class="series-label">Serie — tocca ○ per segnare eseguita</div>
        <div class="series-list">${seriesRows}</div>
      </div>

      <div class="card-actions">
        <div class="position-wrap">
          Pos. <input type="number" min="1" max="10" value="${slot.position}"
                      onchange="updateSlotPosition('${slot.exId}', ${activeTab}, +this.value)">
        </div>
        <button class="btn-remove-slot"
                onclick="removeSlot('${slot.exId}', ${activeTab})">✕ Rimuovi dal giorno</button>
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════
// NAVIGAZIONE
// ═══════════════════════════════════════════
function switchTab(i) {
  activeTab = i; render();
  openFirstExercise();
}
function toggleEditMode() {
  editMode = !editMode; render();
  showToast(editMode ? '🔓 Modalità modifica attiva' : '🔒 Modalità modifica disattiva');
}
function dayInProgress() {
  return state.days.slice(0, state.numDays).findIndex(d =>
    d.slots.some(sl => effDone(sl).some(Boolean))
  );
}
// Giorno COMPLETATO: ha esercizi con serie e tutte le serie sono spuntate.
function dayAllDone(d) {
  if (!d.slots.length) return false;
  let hasSeries = false;
  for (const sl of d.slots) {
    const ex   = effEx(sl);
    const done = effDone(sl);
    const n    = ex ? ex.series.length : done.length;
    if (n === 0) continue;
    hasSeries = true;
    for (let i = 0; i < n; i++) if (!done[i]) return false;
  }
  return hasSeries;
}
// Giorno PARZIALE: almeno una serie spuntata, ma non tutte (allenamento da riprendere).
function dayPartiallyDone(d) {
  const some = d.slots.some(sl => effDone(sl).some(Boolean));
  return some && !dayAllDone(d);
}
function openFirstExercise() {
  const slots = getSlots();
  const first = slots.find(sl => effDone(sl).some(d => !d));
  if (!first) return;
  setTimeout(() => {
    const card = document.getElementById(`card-${first.exId}-${activeTab}`);
    if (card) card.classList.add('open');
  }, 50);
}

// ═══════════════════════════════════════════
// ESERCIZI — MODIFICA
// ═══════════════════════════════════════════
function updateExName(id, val) {
  const ex = findEx(id);
  if (!ex) return;
  const t = val.trim();
  // unicità nome
  if (t && state.exercises.some(e => e.id !== id && e.name.trim().toLowerCase() === t.toLowerCase())) {
    showToast('⚠️ Nome già esistente'); return;
  }
  ex.name = t || ex.name;
  saveState();
  // aggiorna titolo card in-place
  const cardId = `card-${slotKeyFor(id)}-${activeTab}`;
  const titleEl = document.querySelector(`#${cardId} .card-title`);
  if (titleEl) titleEl.firstChild.textContent = ex.name + ' ';
}
function updateExField(id, field, value) {
  const ex = findEx(id); if (!ex) return;
  ex[field] = value; saveState();
}
function updateExSets(id, n) {
  const ex = findEx(id); if (!ex) return;
  n = Math.max(1, Math.min(20, n));
  const lastReps   = ex.series[ex.series.length-1]?.reps   ?? 10;
  const lastWeight = ex.series[ex.series.length-1]?.weight ?? 0;
  while (ex.series.length < n) ex.series.push({ reps: lastReps, weight: lastWeight });
  ex.series.splice(n);
  ex.sets = n;
  // Aggiorna done in tutti i giorni per questo esercizio
  state.days.forEach(d => d.slots.forEach(sl => {
    if (sl.exId === id) {
      while (sl.done.length < n) sl.done.push(false);
      sl.done.splice(n);
    }
  }));
  saveState();
  const cardKey = slotKeyFor(id);
  const wasOpen = document.getElementById(`card-${cardKey}-${activeTab}`)?.classList.contains('open');
  renderMain();
  if (wasOpen) document.getElementById(`card-${cardKey}-${activeTab}`)?.classList.add('open');
}
// Cambio manuale del gruppo (forzatura): la classificazione automatica resta
// solo un punto di partenza, qui l'utente può correggerla liberamente.
function updateExGroup(id, groupId) {
  const ex = findEx(id); if (!ex) return;
  ex.group = GROUP_IDS.includes(groupId) ? groupId : DEFAULT_GROUP; // whitelist di sicurezza
  saveState();
  rerenderKeepCard(id);
  showToast(`Gruppo: ${groupInfo(ex.group).label}`);
}
// Ridisegna il main mantenendo aperta la card indicata (per riallineare le input)
function rerenderKeepCard(id) {
  const cardKey = slotKeyFor(id);
  const wasOpen = document.getElementById(`card-${cardKey}-${activeTab}`)?.classList.contains('open');
  renderMain();
  if (wasOpen) document.getElementById(`card-${cardKey}-${activeTab}`)?.classList.add('open');
}
function updateSerieReps(id, si, val) {
  const ex = findEx(id); if (!ex || !ex.series[si]) return;
  const reps = Math.max(1, Math.min(999, val||1));
  if (!ex.pyramid) { ex.series.forEach(s => s.reps = reps); }
  else ex.series[si].reps = reps;
  ex.lastModified = Date.now();
  ex.difficulty = { val: null, count: 0 };
  saveState();
  if (!ex.pyramid) rerenderKeepCard(id);   // riallinea le altre righe a schermo
}
function updateSerieWeight(id, si, val) {
  const ex = findEx(id); if (!ex || !ex.series[si]) return;
  const w = Math.max(0, Math.min(999, val||0));
  if (!ex.pyramid) { ex.series.forEach(s => s.weight = w); }
  else ex.series[si].weight = w;
  ex.lastModified = Date.now();
  ex.difficulty = { val: null, count: 0 };
  saveState();
  if (!ex.pyramid) rerenderKeepCard(id);   // riallinea le altre righe a schermo
}
function togglePyramid(id) {
  if (!editMode) { showToast('🔒 Sblocca prima il lucchetto'); return; }
  const ex = findEx(id); if (!ex) return;
  ex.pyramid = !ex.pyramid;
  if (!ex.pyramid) {
    // OFF: la prima serie si copia su tutte (comodo per esercizi uguali)
    const base = ex.series[0]?.reps ?? 10;
    ex.series.forEach(s => s.reps = base);
  }
  // ON: nessun preset applicato — ogni serie resta com'è, modificabile indipendentemente
  saveState();
  const cardKey = slotKeyFor(id);
  const wasOpen = document.getElementById(`card-${cardKey}-${activeTab}`)?.classList.contains('open');
  renderMain();
  if (wasOpen) document.getElementById(`card-${cardKey}-${activeTab}`)?.classList.add('open');
}

// ═══════════════════════════════════════════
// SLOT — AGGIUNTA / RIMOZIONE / POSIZIONE
// ═══════════════════════════════════════════
function openAddSlot() { openModal('add-slot-modal'); renderLibraryList(''); }
function renderLibraryList(filter) {
  const f    = (filter||'').toLowerCase();
  const used = new Set(state.days[activeTab].slots.map(sl => sl.exId));
  const list = state.exercises.filter(e =>
    e.name.toLowerCase().includes(f) && !used.has(e.id)
  );
  document.getElementById('library-list').innerHTML = list.length
    ? list.map(e => `
      <div class="ex-list-item" style="border-left:4px solid ${groupInfo(e.group).color}" onclick="addSlot('${e.id}')">
        <div class="ex-list-name">${escHtml(e.name)}</div>
        <div class="ex-list-meta">${e.sets} serie${e.pyramid?' · ⚖️':''}</div>
        <div class="ex-list-add">＋</div>
      </div>`).join('')
    : `<div class="no-data">Nessun esercizio disponibile</div>`;
}
function addSlot(exId) {
  const ex   = findEx(exId); if (!ex) return;
  const slots = state.days[activeTab].slots;
  const maxPos = slots.reduce((m,sl) => Math.max(m, sl.position), 0);
  slots.push({ exId, position: maxPos+1, done: Array(ex.series.length).fill(false) });
  saveState(); closeModal('add-slot-modal'); renderMain();
  showToast(`✅ ${ex.name} aggiunto`);
}
function removeSlot(exId, dayIdx) {
  if (!confirm('Rimuovere questo esercizio dal giorno?')) return;
  state.days[dayIdx].slots = state.days[dayIdx].slots.filter(sl => sl.exId !== exId);
  saveState(); renderMain();
}
function updateSlotPosition(exId, dayIdx, pos) {
  const sl = state.days[dayIdx].slots.find(s => s.exId === exId);
  if (sl) { sl.position = Math.max(1, Math.min(10, pos)); saveState(); renderMain(); }
}

// ═══════════════════════════════════════════
// SOSTITUZIONE TEMPORANEA (v3.11)
// ═══════════════════════════════════════════
// "Macchina occupata in palestra": sostituisce per QUESTO allenamento un
// esercizio con un altro dello stesso gruppo, senza toccare la struttura
// della scheda (slot.exId non cambia mai). Disponibile sempre, anche a
// lucchetto chiuso: non è una modifica di struttura, è un'azione d'uso
// quotidiano come spuntare una serie.
let subPickerSlotExId = null;

function openSubPicker(slotExId) {
  subPickerSlotExId = slotExId;
  renderSubPicker();
  openModal('sub-picker-modal');
}

function renderSubPicker() {
  const slot = state.days[activeTab].slots.find(sl => sl.exId === subPickerSlotExId);
  if (!slot) { closeModal('sub-picker-modal'); return; }
  const original = findEx(slot.exId);
  if (!original) { closeModal('sub-picker-modal'); return; }

  document.getElementById('sub-picker-subtitle').textContent =
    `Gruppo: ${groupInfo(original.group).label} — al posto di "${original.name}"`;

  const revertHtml = slot.subExId
    ? `<div class="sub-revert-item" onclick="revertSubstitute('${slot.exId}')">
        ↩ Ripristina l'esercizio previsto (${escHtml(original.name)})
      </div>`
    : '';

  const candidates = state.exercises
    .filter(e => e.group === original.group && e.id !== original.id && e.id !== slot.subExId)
    .sort((a,b) => (a.lastDone ?? 0) - (b.lastDone ?? 0) || a.name.localeCompare(b.name));  // più vecchio prima; mai eseguiti in testa

  const fmtLast = t => t ? 'ultima volta: ' + new Date(t).toLocaleDateString('it-IT',{day:'numeric',month:'short'}) : 'mai eseguito';

  const listHtml = candidates.length
    ? candidates.map(e => `
      <div class="ex-list-item" style="border-left:4px solid ${groupInfo(e.group).color}"
           onclick="chooseSubstitute('${e.id}')">
        <div class="ex-list-name">${escHtml(e.name)}</div>
        <div class="ex-list-meta">${e.sets} serie${e.pyramid?' · ⚖️':''} · ${fmtLast(e.lastDone)}</div>
        <div class="ex-list-add">🔀</div>
      </div>`).join('')
    : '<div class="no-data">Nessun altro esercizio in questo gruppo</div>';

  document.getElementById('sub-picker-list').innerHTML = revertHtml + listHtml;
}

function chooseSubstitute(newExId) {
  const slot = state.days[activeTab].slots.find(sl => sl.exId === subPickerSlotExId);
  const newEx = findEx(newExId);
  if (!slot || !newEx) return;
  slot.subExId = newExId;
  slot.subDone = Array(newEx.series.length).fill(false); // istanza nuova: nessuna serie ancora fatta
  saveState();
  closeModal('sub-picker-modal');
  renderMain();
  showToast(`🔀 Sostituito con ${newEx.name} (solo per oggi)`);
}

function revertSubstitute(slotExId) {
  const slot = state.days[activeTab].slots.find(sl => sl.exId === slotExId);
  if (!slot) return;
  slot.subExId = null;
  slot.subDone = null;
  saveState();
  closeModal('sub-picker-modal');
  renderMain();
  showToast('↩ Esercizio previsto ripristinato');
}

// TOGGLE CARD / NOTES
// ═══════════════════════════════════════════
function toggleCard(cardId) { document.getElementById(cardId)?.classList.toggle('open'); }
function toggleNotes(id) {
  const btn = document.getElementById('notes-btn-'+id);
  const body = document.getElementById('notes-body-'+id);
  if (!btn||!body) return;
  const open = body.classList.toggle('open');
  btn.classList.toggle('open', open);

// ═══════════════════════════════════════════
// TOGGLE SERIE
// ═══════════════════════════════════════════
function toggleSerie(exId, dayIdx, si) {
  const slot = state.days[dayIdx].slots.find(sl => sl.exId === exId);
  if (!slot) return;
  const ex   = effEx(slot);      // esercizio effettivamente in corso (sostituto se attivo)
  if (!ex) return;
  const done = effDone(slot);    // array done effettivo (subDone se sostituito)

  done[si] = !done[si];
  if (done[si]) ex.lastDone = Date.now();   // per ordinare i sostituti (v3.13)
  saveState();

  // DOM in-place — sempre keyed sull'exId ORIGINALE (identità stabile dello slot)
  const rowId = `row-${exId}-${dayIdx}-${si}`;
  const row   = document.getElementById(rowId);
  const btn   = row?.querySelector('.serie-check-btn');
  if (row) row.classList.toggle('done-row', done[si]);
  if (btn) { btn.classList.toggle('done', done[si]); btn.textContent = done[si]?'✓':'○'; }

  const doneCnt = done.filter(Boolean).length;
  const allDone = doneCnt === ex.series.length;
  const meta    = document.getElementById(`meta-${exId}-${dayIdx}`);
  if (meta) meta.textContent = `${doneCnt}/${ex.series.length}`;

  const cardId  = `card-${exId}-${dayIdx}`;
  const card    = document.getElementById(cardId);
  if (card) {
    card.classList.toggle('all-done', allDone);
    if (allDone) card.classList.remove('open');
    const titleEl = card.querySelector('.card-title');
    if (titleEl && allDone) {
      const badge = `<span class="card-done-badge">✓ COMPLETATO</span>`;
      // rimuovi badge precedente se c'è
      const old = titleEl.querySelector('.card-done-badge');
      if (old) old.remove();
      titleEl.insertAdjacentHTML('beforeend', badge);
    } else if (titleEl && !allDone) {
      titleEl.querySelector('.card-done-badge')?.remove();
    }
  }

  if (done[si]) {
    const nextSerie  = ex.series[si+1] ?? null;
    const completedId = allDone ? ex.id : null;   // id EFFETTIVO (sostituto o previsto)
    startTimer(state.restSeconds, nextSerie, allDone, ex.notes, completedId, si, ex.series.length);
  }
}

// ═══════════════════════════════════════════
// GIORNO CORRENTE — LOGICA
// ═══════════════════════════════════════════
function countDoneExercises() {
  const slots = state.days[activeTab].slots;
  return slots.filter(sl => { const d = effDone(sl); return d.length > 0 && d.every(Boolean); }).length;
}
// Restituisce lo SLOT (non l'esercizio) col primo esercizio non completato,
// così chi chiama ha sia l'exId originale (per aprire la card giusta) sia
// l'esercizio effettivo (sostituto incluso) per mostrarne nome/serie/note.
function nextIncompleteSlot() {
  const slots = getSlots();
  return slots.find(sl => effDone(sl).some(d => !d)) ?? null;
}

// ═══════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════
async function acquireWakeLock() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}
function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }

function startTimer(seconds, nextSerie, exCompleted, notes, completedExId, si, serieTotal) {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerTotal = seconds; timerRemaining = seconds;
  timerCompletedExId = completedExId ?? null;
  acquireWakeLock();

  const ov   = document.getElementById('timer-overlay');
  const cntEl = document.getElementById('timer-count');
  const prg  = document.getElementById('timer-prog');
  const nlbl = document.getElementById('timer-next-label');
  const nxt  = document.getElementById('timer-next');
  const ntxt = document.getElementById('timer-notes-text');
  const ibox = document.getElementById('timer-info-box');
  const dbox = document.getElementById('difficulty-box');
  const sts  = document.getElementById('timer-stats');

  // Stats
  if (si != null) {
    document.getElementById('timer-serie-val').textContent = `${si+1}/${serieTotal}`;
    document.getElementById('timer-ex-val').textContent    = `${countDoneExercises()}`;
    sts.style.display = 'flex';
  } else { sts.style.display = 'none'; }

  // Difficulty
  if (completedExId) {
    const cex = findEx(completedExId);
    dbox.style.display = 'block';
    updateDiffButtons(cex?.difficulty ?? {val:null,count:0});
  } else { dbox.style.display = 'none'; }

  // Info prossimo
  if (exCompleted) {
    timerNextExId = null;
    const nxSlot = nextIncompleteSlot();
    const nx     = nxSlot ? effEx(nxSlot) : null;
    timerNextExId = nxSlot?.exId ?? null;   // exId ORIGINALE: è quello con cui è renderizzata la card
    if (nx) {
      const nxDone = nxSlot ? effDone(nxSlot) : [];
      const fs = nx.series.find((s,i) => !nxDone[i]) ?? nx.series[0];
      nlbl.textContent = 'Prossimo esercizio';
      nxt.className    = 'timer-next';
      const nxUp = (nx.difficulty?.val === 2 && nx.difficulty.count >= 3)
        ? ' <span style="color:var(--accent);font-weight:800" title="Alza il peso">⬆</span>' : '';
      nxt.innerHTML    = `${escHtml(nx.name)}${nxUp}<br><span style="font-size:1.2rem;color:var(--muted)">${fs.reps} rip · ${fs.weight} kg</span>`;
      ntxt.textContent = nx.notes || '';
      ntxt.style.display = nx.notes ? 'block' : 'none';
    } else {
      nlbl.textContent = '';
      nxt.className    = 'timer-completed';
      nxt.textContent  = '🏆 Allenamento completato';
      ntxt.style.display = 'none';
    }
    ibox.style.display = 'block';
  } else if (nextSerie) {
    timerNextExId = null;
    nlbl.textContent = 'Prossima serie';
    nxt.className    = 'timer-next';
    nxt.textContent  = `${nextSerie.reps} rip · ${nextSerie.weight} kg`;
    ntxt.style.display = 'none';
    ibox.style.display = 'block';
  } else { ibox.style.display = 'none'; }

  ov.classList.add('visible');
  updateTimerRing(cntEl, prg);

  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerRing(cntEl, prg);
    if (timerRemaining <= 0) {
      clearInterval(timerInterval); timerInterval = null;
      ov.classList.remove('visible');
      releaseWakeLock(); playBeep(); vibratePhone();
      openNextExercise();
    }
  }, 1000);
}

function updateTimerRing(cntEl, prg) {
  cntEl.textContent = timerRemaining;
  prg.style.strokeDashoffset = CIRC * (1 - (timerTotal>0?timerRemaining/timerTotal:0));
}
function skipTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  releaseWakeLock();
  document.getElementById('timer-overlay').classList.remove('visible');
  openNextExercise();
}
function openNextExercise() {
  if (!timerNextExId) return;
  const cardId = `card-${timerNextExId}-${activeTab}`;
  const card   = document.getElementById(cardId);
  if (card) {
    card.classList.add('open');
    setTimeout(() => card.scrollIntoView({behavior:'smooth',block:'start'}), 100);
  }
  timerNextExId = null;
}

// ═══════════════════════════════════════════
// AUDIO / VIBRAZIONE
// ═══════════════════════════════════════════
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function playBeep() {
  try {
    const ctx = getAudioCtx();
    [0,350,700].forEach(d => {
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type='square'; o.frequency.value=880;
      const t=ctx.currentTime+d/1000;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.8,t+.01);
      g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.start(t); o.stop(t+.55);
    });
  } catch(e){}
}
function vibratePhone() {
  try { if ('vibrate' in navigator) navigator.vibrate([600,200,600,200,600]); } catch(e){}
}

// ═══════════════════════════════════════════
// DIFFICULTY
// ═══════════════════════════════════════════
function updateDiffButtons(diff) {
  [0,1,2].forEach(v => {
    const btn   = document.getElementById('diff-'+v);
    const count = document.getElementById('diff-count-'+v);
    if (!btn||!count) return;
    btn.classList.toggle('selected', diff.val===v);
    count.textContent = diff.val===v && diff.count>1 ? `×${diff.count}` : '';
  });
}
function setDifficulty(val) {
  if (!timerCompletedExId) return;
  const ex = findEx(timerCompletedExId); if (!ex) return;
  if (!ex.difficulty || typeof ex.difficulty!=='object') ex.difficulty={val:null,count:0};
  if (ex.difficulty.val===val) ex.difficulty.count++;
  else ex.difficulty={val,count:1};
  saveState(); updateDiffButtons(ex.difficulty);
}

// ═══════════════════════════════════════════
// MODAL CHIUDI ALLENAMENTO
// ═══════════════════════════════════════════
function openCloseModal() {
  document.getElementById('close-modal-day').textContent = state.days[activeTab].name;
  const prev = document.getElementById('close-modal-prev');
  if (state.bodyWeights.length>0) {
    const last = state.bodyWeights[state.bodyWeights.length-1];
    const ds   = new Date(last.ts).toLocaleDateString('it-IT',{day:'numeric',month:'long'});
    prev.innerHTML = `Ultima: <strong>${last.kg} kg</strong> — ${ds}`;
  } else { prev.textContent = 'Prima rilevazione'; }
  document.getElementById('bw-input').value='';
  openModal('close-modal');
}
function confirmCloseWorkout() {
  const raw = document.getElementById('bw-input').value.trim();
  if (raw!=='') {
    const kg = parseFloat(raw);
    if (isNaN(kg)||kg<30||kg>300) { showToast('Peso non valido (30–300 kg)'); return; }
    state.bodyWeights.push({kg, ts:Date.now()});
  }
  state.lastSession = { dayName: state.days[activeTab].name, ts: Date.now() };
  // Reset done del giorno + ripristino di eventuali sostituzioni temporanee:
  // "alla volta successiva" la scheda torna sempre all'esercizio previsto.
  state.days[activeTab].slots.forEach(sl => {
    sl.done.fill(false);
    sl.subExId = null;
    sl.subDone = null;
  });
  const finishedIdx = activeTab;
  saveState(); closeModal('close-modal');
  logEvent(`Allenamento chiuso: ${state.days[finishedIdx].name}`);
  exportData();
  // Avanza al giorno successivo e aprilo: il prossimo allenamento è subito pronto
  activeTab = (finishedIdx + 1) % state.numDays;
  render();
  openFirstExercise();
  showToast(`✅ Salvato! Prossimo: ${state.days[activeTab].name}`);
}

// EDITOR ESERCIZIO
// ═══════════════════════════════════════════
function openExerciseEditor(exId) {
  if (!editMode) { showToast('🔒 Sblocca prima il lucchetto'); return; }
  editorExId = exId;
  const ex   = exId ? findEx(exId) : null;
  edPyramid  = ex?.pyramid ?? false;

  document.getElementById('ex-editor-title').textContent = ex ? 'Modifica esercizio' : 'Nuovo esercizio';
  document.getElementById('ex-ed-name').value   = ex?.name  ?? '';
  document.getElementById('ex-ed-sets').value   = ex?.sets  ?? 3;
  document.getElementById('ex-ed-notes').value  = ex?.notes ?? '';
  document.getElementById('ex-ed-group').innerHTML = GROUPS.map(g =>
    `<option value="${g.id}">${escHtml(g.label)}</option>`).join('');
  document.getElementById('ex-ed-group').value = ex?.group ?? DEFAULT_GROUP;
  document.getElementById('ex-ed-pyramid-btn').textContent = edPyramid ? 'SÌ' : 'NO';
  document.getElementById('ex-ed-pyramid-btn').classList.toggle('on', edPyramid);
  document.getElementById('ex-ed-del-btn').style.display = ex ? 'block' : 'none';

  renderEditorSeries(ex);
  closeModal('add-slot-modal');
  openModal('ex-editor-modal');
}

function renderEditorSeries(ex) {
  const sets  = parseInt(document.getElementById('ex-ed-sets').value) || 3;
  const existing = ex?.series ?? [];
  let html = '';
  for (let i=0; i<sets; i++) {
    const s   = existing[i] ?? { reps: 10, weight: 0 };
    html += `<div style="display:flex;gap:7px;margin-bottom:6px;align-items:center">
      <span style="font-size:.8rem;color:var(--muted);width:55px">Serie ${i+1}</span>
      <input type="number" min="1" max="999" value="${s.reps}" placeholder="rip"
             style="flex:1;background:var(--surf2);border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-size:.88rem"
             id="eds-reps-${i}">
      <input type="number" min="0" max="999" step=".5" value="${s.weight}" placeholder="kg"
             style="flex:1;background:var(--surf2);border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-size:.88rem"
             id="eds-weight-${i}">
    </div>`;
  }
  document.getElementById('ex-ed-series').innerHTML = html;
}

function toggleEdPyramid() {
  edPyramid = !edPyramid;
  document.getElementById('ex-ed-pyramid-btn').textContent = edPyramid ? 'SÌ' : 'NO';
  document.getElementById('ex-ed-pyramid-btn').classList.toggle('on', edPyramid);
  // Nessun preset applicato: accendere/spegnere il flag non modifica i valori già inseriti.
  // ON: ogni serie resta modificabile indipendentemente, senza alcun valore suggerito.
}

// Aggiorna serie nell'editor quando cambia il numero
document.getElementById('ex-ed-sets').addEventListener('input', function() {
  renderEditorSeries(editorExId ? findEx(editorExId) : null);
});

function saveExercise() {
  const name = document.getElementById('ex-ed-name').value.trim();
  if (!name) { showToast('Inserisci un nome'); return; }
  const sets = Math.max(1, Math.min(20, parseInt(document.getElementById('ex-ed-sets').value)||3));
  const groupSel = document.getElementById('ex-ed-group').value;
  const group = GROUP_IDS.includes(groupSel) ? groupSel : DEFAULT_GROUP; // whitelist di sicurezza

  // Unicità nome
  if (state.exercises.some(e => e.id !== editorExId && e.name.trim().toLowerCase() === name.toLowerCase())) {
    showToast('⚠️ Nome già esistente'); return;
  }

  const series = [];
  for (let i=0; i<sets; i++) {
    series.push({
      reps:   parseInt(document.getElementById(`eds-reps-${i}`)?.value)   || 10,
      weight: parseFloat(document.getElementById(`eds-weight-${i}`)?.value) || 0
    });
  }

  if (editorExId) {
    const ex = findEx(editorExId);
    if (!ex) return;
    ex.name  = name;
    ex.sets  = sets;
    ex.group = group;
    ex.notes = document.getElementById('ex-ed-notes').value;
    ex.pyramid = edPyramid;
    ex.series  = series;
    ex.lastModified = Date.now();
    // Aggiusta done in tutti i giorni
    state.days.forEach(d => d.slots.forEach(sl => {
      if (sl.exId === editorExId) {
        while (sl.done.length < sets) sl.done.push(false);
        sl.done.splice(sets);
      }
    }));
  } else {
    const ex = {
      id: uid(), name, sets, group, pyramid: edPyramid,
      notes: document.getElementById('ex-ed-notes').value,
      difficulty: {val:null,count:0},
      lastModified: Date.now(),
      series
    };
    state.exercises.push(ex);
  }

  saveState();
  closeModal('ex-editor-modal');
  renderMain();
  renderLibrarySettings();
  showToast(editorExId ? '✅ Esercizio aggiornato' : '✅ Esercizio creato');
}

function deleteExerciseFromLib() {
  if (!editorExId) return;
  const ex = findEx(editorExId);
  if (!confirm(`Eliminare "${ex?.name}"? Verrà rimosso da tutti i giorni.`)) return;
  state.exercises = state.exercises.filter(e => e.id !== editorExId);
  state.days.forEach(d => d.slots = d.slots.filter(sl => sl.exId !== editorExId));
  saveState(); closeModal('ex-editor-modal'); renderMain(); renderLibrarySettings();
  showToast('✅ Esercizio eliminato');
}

function renderLibrarySettings() {
  document.getElementById('ex-library-list').innerHTML = [...state.exercises]

    <div class="ex-lib-item" style="border-left:4px solid ${groupInfo(e.group).color}">
