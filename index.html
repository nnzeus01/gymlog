    </div>`).join('') || '<div class="no-data">Nessun esercizio in libreria</div>';
}
function quickDelEx(id) {
  const ex = findEx(id);
  if (!confirm(`Eliminare "${ex?.name}"?`)) return;
  state.exercises = state.exercises.filter(e => e.id !== id);
  state.days.forEach(d => d.slots = d.slots.filter(sl => sl.exId !== id));
  saveState(); renderLibrarySettings(); renderMain();
}

function updateDayName(dayIdx, val) {
  state.days[dayIdx].name = val.trim() || `${dayIdx+1}° Allenamento`;
  renderTabs(); saveState();
}
function updateRest(val) {
  state.restSeconds = Math.max(10, Math.min(600, parseInt(val)||60));
  saveState();
}

// ═══════════════════════════════════════════
// STATS PESO
// ═══════════════════════════════════════════
function openStats() { document.getElementById('stats-screen').classList.add('visible'); renderStats(); }
function closeStats() { document.getElementById('stats-screen').classList.remove('visible'); }
function deleteWeight(idx) {
  if (!confirm('Eliminare questa rilevazione?')) return;
  state.bodyWeights.splice(idx,1); saveState(); renderStats();
}
function renderStats() {
  const bw = state.bodyWeights;
  document.getElementById('weight-list').innerHTML = bw.length===0
    ? '<div class="no-data">Nessuna rilevazione</div>'
    : [...bw].reverse().map((w,ri) => {
        const idx = bw.length-1-ri;
        const d   = new Date(w.ts);
        const ds  = d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
        const ts  = d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
        return `<div class="weight-entry">
          <div class="we-date">${ds} — ${ts}</div>
          <div class="we-kg">${w.kg} kg</div>
          <button class="we-del" onclick="deleteWeight(${idx})">✕</button>
        </div>`;
      }).join('');
  drawWeightChart(document.getElementById('weight-canvas'), bw);
}
function drawWeightChart(canvas, weights) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const W   = (canvas.parentElement.clientWidth-32)||300;
  const H   = 180;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#201f24'; ctx.fillRect(0,0,W,H);
  if (!weights.length) {
    ctx.fillStyle='#a89f92'; ctx.font='13px DM Sans,sans-serif'; ctx.textAlign='center';
    ctx.fillText('Nessun dato',W/2,H/2); return;
  }
  const P={t:18,r:16,b:36,l:46}, cW=W-P.l-P.r, cH=H-P.t-P.b;
  const vals=weights.map(w=>w.kg);
  let lo=Math.min(...vals)-1, hi=Math.max(...vals)+1;
  if(lo===hi){lo-=2;hi+=2;}
  const mg=(hi-lo)*.15; lo-=mg; hi+=mg;
  const n=weights.length;
  const xOf=i=>n===1?P.l+cW/2:P.l+(i/(n-1))*cW;
  const yOf=v=>P.t+(1-(v-lo)/(hi-lo))*cH;
  for(let g=0;g<=4;g++){
    const y=P.t+(g/4)*cH, lv=hi-(g/4)*(hi-lo);
    ctx.strokeStyle='#3a383e'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(P.l+cW,y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#a89f92'; ctx.font='10px DM Sans,sans-serif'; ctx.textAlign='right';
    ctx.fillText(lv.toFixed(1),P.l-6,y+4);
  }
  ctx.beginPath();
  weights.forEach((w,i)=>i===0?ctx.moveTo(xOf(i),yOf(w.kg)):ctx.lineTo(xOf(i),yOf(w.kg)));
  ctx.lineTo(xOf(n-1),P.t+cH); ctx.lineTo(xOf(0),P.t+cH); ctx.closePath();
  const grad=ctx.createLinearGradient(0,P.t,0,P.t+cH);
  grad.addColorStop(0,'rgba(95,174,130,.22)'); grad.addColorStop(1,'rgba(95,174,130,0)');
  ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath();
  weights.forEach((w,i)=>i===0?ctx.moveTo(xOf(i),yOf(w.kg)):ctx.lineTo(xOf(i),yOf(w.kg)));
  ctx.strokeStyle='#5fae82'; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  weights.forEach((w,i)=>{
    const x=xOf(i),y=yOf(w.kg);
    ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2);
    ctx.fillStyle='#5fae82'; ctx.fill();
    ctx.strokeStyle='#121114'; ctx.lineWidth=2; ctx.stroke();
    const show=n<=6||i===0||i===n-1;
    if(show){
      const lb=new Date(w.ts).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
      ctx.fillStyle='#a89f92'; ctx.font='9px DM Sans,sans-serif';
      ctx.textAlign=i===0?'left':i===n-1?'right':'center';
      ctx.fillText(lb,x,H-P.b+14);
    }
  });
}

// ═══════════════════════════════════════════
// RIEPILOGO PER GRUPPO
// ═══════════════════════════════════════════
function openSummary()  { document.getElementById('summary-screen').classList.add('visible'); renderSummary(); }
function closeSummary() { document.getElementById('summary-screen').classList.remove('visible'); }
function renderSummary() {
  const activeDays = state.days.slice(0, state.numDays);

  const html = GROUPS.map(g => {
    const exs = state.exercises.filter(e => (GROUP_IDS.includes(e.group) ? e.group : DEFAULT_GROUP) === g.id);
    const daysUsed = new Set();

    const items = exs.length
      ? [...exs].sort((a,b) => a.name.localeCompare(b.name)).map(e => {
          const badges = activeDays.map((d, di) => {
            const assigned = d.slots.some(sl => sl.exId === e.id);
            if (assigned) daysUsed.add(di);
            return `<span class="summary-day-badge ${assigned?'assigned':''}"
              onclick="toggleExerciseInDay('${e.id}', ${di})">${escHtml(d.name)}</span>`;
          }).join('');
          return `<div class="summary-ex-item" style="border-left:4px solid ${g.color}">
            <div class="summary-ex-name">${escHtml(e.name)}</div>
            <div class="summary-ex-days">${badges}</div>
          </div>`;
        }).join('')
      : '<div class="no-data">Nessun esercizio in questo gruppo</div>';

    return `
      <div class="summary-group">
        <div class="summary-group-hd" style="border-left:4px solid ${g.color}">
          <span class="summary-group-name">${escHtml(g.label)}</span>
          <span class="summary-group-count">${exs.length} esercizi · ${daysUsed.size}/${activeDays.length} giorni</span>
        </div>
        ${items}
      </div>`;
  }).join('');

  document.getElementById('summary-body').innerHTML = html ||
    '<div class="no-data">Nessun esercizio in libreria</div>';
}

// Assegna/rimuove un esercizio da un giorno, toccando i badge nel Riepilogo.
// Solo in modalità modifica (lucchetto sbloccato). Nessuna conferma alla
// rimozione: qui si riprogetta la scheda, non si è a metà allenamento —
// la sicurezza "chiedi conferma" serve solo durante l'uso in palestra.
function toggleExerciseInDay(exId, dayIdx) {
  if (!editMode) { showToast('🔒 Sblocca prima il lucchetto'); return; }
  const ex = findEx(exId); if (!ex) return;
  const day = state.days[dayIdx]; if (!day) return;

  const idx = day.slots.findIndex(sl => sl.exId === exId);
  if (idx !== -1) {
    day.slots.splice(idx, 1);
    saveState(); renderSummary(); renderTabs(); if (dayIdx === activeTab) renderMain();
    showToast(`➖ Rimosso da ${day.name}`);
  } else {
    const maxPos = day.slots.reduce((m,sl) => Math.max(m, sl.position), 0);
    day.slots.push({ exId, position: maxPos+1, done: Array(ex.series.length).fill(false) });
    saveState(); renderSummary(); renderTabs(); if (dayIdx === activeTab) renderMain();
    showToast(`➕ Aggiunto a ${day.name}`);
  }
}

// ═══════════════════════════════════════════
// TAB AUTOMATICO
// ═══════════════════════════════════════════
function setInitialTab() {
  const days = state.days.slice(0, state.numDays);
  // 1) Giorno parzialmente fatto -> riprendilo (apri il primo esercizio incompleto)
  const partial = days.findIndex(d => dayPartiallyDone(d));
  if (partial !== -1) { activeTab = partial; return true; }
  // 2) Giorno completato ma non chiuso -> non restare bloccato lì, vai al successivo
  const completed = days.findIndex(d => dayAllDone(d));
  if (completed !== -1) { activeTab = (completed + 1) % state.numDays; return true; }
  // 3) Altrimenti riparti dal giorno dopo l'ultima sessione chiusa
  if (state.lastSession) {
    const li = state.days.findIndex(d => d.name === state.lastSession.dayName);
    if (li !== -1) activeTab = (li + 1) % state.numDays;
  }
  return true;
}

// ═══════════════════════════════════════════
// PWA (v3.14)
// ═══════════════════════════════════════════
// Registra il service worker solo quando la pagina arriva da un sito
// (https, o localhost). Aperto come file dal PC (file://) non fa nulla:
// l'app funziona come prima.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(() => logEvent('Service worker registrato'))
      .catch(err => logEvent('Service worker non registrato: ' + err.message));
  });
  // Chiede al browser di non cancellare i dati salvati quando lo spazio
  // scarseggia. Il browser può rifiutare: in quel caso non cambia nulla.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist()
      .then(ok => logEvent('Memoria persistente: ' + (ok ? 'concessa' : 'non concessa')))
      .catch(() => {});
  }
}
